<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flostocks Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,400..900;1,62..125,400..900&family=Figtree:wght@400;500;600;700&family=Lexend:wght@400;700;800&display=swap">
<style>
/* Layout: neubrutalist board. Thick ink outlines, hard offset shadows, flat brand-green and black blocks.
   Brand bar on top, month grid left, the selected day's posts right; stacks on phones. */
:root {
  --bg: #FFFFFF;
  --faint: #F5F8F2;
  --surface: #FFFFFF;
  --ink: #0B0D0A;
  --muted: #4A5345;
  --edge: #0B0D0A;
  --green: #2E9C00;
  --green-ink: #1F6B00;
  --green-soft: #B6EC8F;
  --sched-soft: #FFD84D;
  --pend-soft: #FF9A8B;
  --on-pill: #0B0D0A;
  --tint: #DDF0CC;
  --logo-g: #2E9C00;
  --logo-k: #000000;
  --scrim: rgba(255, 255, 255, .9);
  --hard-c: #0B0D0A;
  --p-ig: #E1306C; --p-fb: #1877F2; --p-li: #0A66C2; --p-x: #0B0D0A; --p-tt: #19C2CC; --p-yt: #FF2A1A;
  --p-x-fg: #FFFFFF;
  --danger: #E5281A;
  --bw: 2.5px;
  --hard: 4px 4px 0 var(--hard-c);
  --hard-lg: 7px 7px 0 var(--hard-c);
  --f-display: "Archivo", "Arial Black", Arial, sans-serif;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 6px;
}
* { box-sizing: border-box; }
html { color-scheme: light; }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--green); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Neubrutal buttons ---------- */
.icon-btn, .ghost, .primary, .danger-btn {
  border: var(--bw) solid var(--edge); border-radius: var(--r); box-shadow: var(--hard);
  font-weight: 800; transition: transform .08s, box-shadow .08s;
}
.icon-btn:hover, .ghost:hover, .primary:hover, .danger-btn:hover { transform: translate(-1px, -1px); box-shadow: 5px 5px 0 var(--hard-c); }
.icon-btn:active, .ghost:active, .primary:active, .danger-btn:active { transform: translate(4px, 4px); box-shadow: 0 0 0 var(--hard-c); }
.icon-btn { width: 38px; height: 38px; display: grid; place-items: center; background: var(--surface); }
.ghost { background: var(--surface); padding: 7px 13px; font-size: 14px; }
.primary { background: var(--green); color: #fff; padding: 9px 16px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-transform: uppercase; letter-spacing: .04em; font-size: 14px; }
.primary[disabled] { opacity: .5; cursor: not-allowed; }
.danger-btn { background: var(--surface); color: var(--danger); padding: 7px 13px; margin-right: auto; font-size: 14px; }

/* ---------- Brand bar ---------- */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 3px solid var(--edge); }
.bar-in, .wrap { max-width: 1320px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.bar-in { display: flex; align-items: center; gap: 14px 18px; flex-wrap: wrap; padding-block: 12px; }
.brand { display: flex; align-items: center; gap: 10px; margin-right: auto; }
.brand-logo { width: 54px; height: 54px; display: grid; place-items: center; background: var(--surface); border: var(--bw) solid var(--edge); border-radius: var(--r); box-shadow: var(--hard); transition: transform .08s, box-shadow .08s; }
.brand-logo:hover { transform: translate(-1px, -1px) rotate(-3deg); box-shadow: 5px 5px 0 var(--hard-c); }
.brand-logo svg { width: 40px; height: 40px; overflow: visible; }
.brand-name { font-family: var(--f-display); font-weight: 900; font-style: italic; font-stretch: 122%; font-size: 22px; letter-spacing: .01em; line-height: 1; }
.brand-sub { display: inline-block; font-family: var(--f-body); font-style: normal; font-weight: 800; font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; margin-top: 5px; background: var(--green-soft); color: var(--on-pill); border: 2px solid var(--edge); padding: 1px 6px; border-radius: 4px; }
.month-nav { display: flex; align-items: center; gap: 8px; }
.month-label { font-family: var(--f-display); font-weight: 900; font-stretch: 112%; font-size: 19px; min-width: 9.5ch; text-align: center; text-transform: uppercase; font-variant-numeric: tabular-nums; }

/* ---------- Legend ---------- */
.legend { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 22px; padding-block: 18px 6px; font-size: 13px; font-weight: 700; }
.legend-group { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.legend-item { display: inline-flex; align-items: center; gap: 6px; }
.notice { margin-top: 12px; padding: 10px 14px; border: var(--bw) solid var(--edge); background: var(--sched-soft); color: var(--on-pill); border-radius: var(--r); font-size: 14px; font-weight: 700; box-shadow: var(--hard); }

/* ---------- Platform badges & status ---------- */
.pf { --pf: var(--muted); --pf-fg: #fff; display: inline-grid; place-items: center; min-width: 24px; height: 20px; padding: 0 4px; border-radius: 4px; border: 2px solid var(--edge); background: var(--pf); color: var(--pf-fg); font-family: var(--f-display); font-weight: 900; font-size: 10px; letter-spacing: .02em; line-height: 1; }
.pf-instagram { --pf: var(--p-ig); } .pf-facebook { --pf: var(--p-fb); } .pf-linkedin { --pf: var(--p-li); }
.pf-x { --pf: var(--p-x); --pf-fg: var(--p-x-fg); } .pf-tiktok { --pf: var(--p-tt); --pf-fg: #0B0D0A; } .pf-youtube { --pf: var(--p-yt); }
.status { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; border-radius: 4px; border: 2px solid var(--edge); padding: 2px 8px 2px 6px; white-space: nowrap; color: var(--on-pill); }
.status svg { width: 13px; height: 13px; flex: none; }
.st-pending { background: var(--pend-soft); }
.st-scheduled { background: var(--sched-soft); }
.st-uploaded { background: var(--green-soft); }

/* ---------- Main layout ---------- */
.main { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 24px; align-items: start; padding-block: 14px 48px; }
@media (max-width: 980px) { .main { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 720px) { .bar { position: static; } .bar-in { gap: 10px; } .month-nav { flex: 1 1 auto; } .month-label { flex: 1; font-size: 17px; } #add-top { flex: 1 1 100%; } }

/* ---------- Calendar ---------- */
.cal { background: var(--surface); border: 3px solid var(--edge); border-radius: 10px; overflow: hidden; box-shadow: var(--hard-lg); }
.dow, .grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
.dow { background: var(--logo-k); }
.dow div { padding: 10px 10px 9px; font-family: var(--f-display); font-size: 12px; font-weight: 900; letter-spacing: .12em; text-transform: uppercase; color: var(--bg); border-right: 2px solid var(--edge); }
.dow div:nth-child(7n) { border-right: 0; }
.dow div:nth-child(n+6) { color: var(--green-soft); }
.dow .short { display: none; }
.cell { min-height: 132px; border-right: 2px solid var(--edge); border-top: 2px solid var(--edge); padding: 6px; display: flex; flex-direction: column; gap: 5px; cursor: pointer; position: relative; min-width: 0; background: var(--surface); }
.cell:nth-child(7n) { border-right: 0; }
.cell.out { background: var(--faint); }
.cell.out .num { opacity: .5; }
.cell:hover { background: var(--tint); }
.cell.sel { background: var(--tint); box-shadow: inset 0 0 0 3px var(--green); }
.num { align-self: flex-start; border: 2px solid transparent; background: none; font-family: var(--f-display); font-weight: 900; font-size: 15px; font-variant-numeric: tabular-nums; min-width: 30px; height: 30px; border-radius: 4px; display: grid; place-items: center; padding: 0 3px; }
.cell.today .num { background: var(--green); color: #fff; border-color: var(--edge); box-shadow: 2px 2px 0 var(--hard-c); }
.chip { display: flex; align-items: center; gap: 5px; width: 100%; border: 2px solid var(--edge); text-align: left; border-radius: 4px; padding: 3px 5px; font-size: 12px; font-weight: 700; min-width: 0; color: var(--on-pill); box-shadow: 2px 2px 0 var(--hard-c); transition: transform .08s, box-shadow .08s; }
.chip:hover { transform: translate(-1px, -1px); box-shadow: 3px 3px 0 var(--hard-c); }
.chip:active { transform: translate(2px, 2px); box-shadow: 0 0 0 var(--hard-c); }
.chip .pfs { display: flex; gap: 2px; flex: none; }
.chip .pfs .pf { min-width: 0; width: 10px; height: 10px; padding: 0; border-width: 1.5px; border-color: #0B0D0A; border-radius: 2px; font-size: 0; }
.chip .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
.chip svg { width: 13px; height: 13px; flex: none; }
.more { font-size: 11px; font-weight: 800; padding-left: 4px; text-transform: uppercase; letter-spacing: .04em; }
.dots { display: none; gap: 3px; flex-wrap: wrap; padding-left: 2px; }
.dots i { width: 9px; height: 9px; border-radius: 2px; border: 1.5px solid var(--edge); }
.dots i.st-pending { background: var(--pend-soft); }
.dots i.st-scheduled { background: var(--sched-soft); }
.dots i.st-uploaded { background: var(--green-soft); }
@media (max-width: 720px) {
  .cell { min-height: 66px; padding: 4px 2px; align-items: center; }
  .num { align-self: center; }
  .chip, .more { display: none; }
  .dots { display: flex; justify-content: center; }
  .dow div { padding: 8px 0; text-align: center; letter-spacing: .05em; }
  .dow .long { display: none; } .dow .short { display: inline; }
  .cal { box-shadow: var(--hard); }
}

/* ---------- Day panel ---------- */
.day { background: var(--surface); border: 3px solid var(--edge); border-radius: 10px; padding: 18px; display: flex; flex-direction: column; gap: 14px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 92px); box-shadow: var(--hard-lg); }
@media (max-width: 980px) { .day { position: static; } }
.day h2 { margin: 0; font-family: var(--f-display); font-weight: 900; font-stretch: 112%; font-size: 24px; line-height: 1.05; text-transform: uppercase; text-wrap: balance; }
.day .eyebrow { display: inline-block; font-size: 11px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; background: var(--logo-k); color: var(--bg); padding: 2px 7px; border-radius: 3px; margin-bottom: 8px; }
.day-list { display: flex; flex-direction: column; gap: 12px; }
.post { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; border: var(--bw) solid var(--edge); border-radius: var(--r); padding: 10px; background: var(--surface); text-align: left; width: 100%; box-shadow: var(--hard); transition: transform .08s, box-shadow .08s; }
.post:hover { transform: translate(-1px, -1px); box-shadow: 5px 5px 0 var(--hard-c); }
.post:active { transform: translate(4px, 4px); box-shadow: 0 0 0 var(--hard-c); }
.thumb { width: 64px; height: 64px; border-radius: 4px; border: 2px solid var(--edge); background: var(--tint); overflow: hidden; display: grid; place-items: center; font-family: var(--f-display); font-size: 11px; font-weight: 900; }
.thumb img, .thumb video { width: 100%; height: 100%; object-fit: cover; display: block; }
.post-body { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.post-top { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.post-title { font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.time { font-size: 12px; font-weight: 800; font-variant-numeric: tabular-nums; }
.empty { border: 2.5px dashed var(--edge); border-radius: var(--r); padding: 18px; font-size: 14px; font-weight: 600; text-align: center; background: var(--faint); }

/* ---------- Dialogs ---------- */
dialog { border: 3px solid var(--edge); padding: 0; background: var(--surface); color: var(--ink); border-radius: 10px; box-shadow: 9px 9px 0 var(--hard-c); width: min(680px, calc(100vw - 32px)); max-height: calc(100dvh - 40px); overflow: hidden; }
dialog::backdrop { background: rgba(5, 8, 4, .6); }
.dlg { display: flex; flex-direction: column; max-height: calc(100dvh - 46px); }
.dlg-head { display: flex; align-items: flex-start; gap: 12px; padding: 16px 18px 14px; border-bottom: 3px solid var(--edge); background: var(--green-soft); color: var(--on-pill); }
.dlg-head h3 { margin: 0; font-family: var(--f-display); font-weight: 900; font-stretch: 112%; font-size: 22px; line-height: 1.1; flex: 1; min-width: 0; overflow-wrap: anywhere; text-transform: uppercase; }
.dlg-head .sub { font-size: 13px; font-weight: 700; margin-top: 5px; font-family: var(--f-body); font-stretch: 100%; text-transform: none; }
.dlg-head .x-btn { color: var(--on-pill); border: 2px solid #0B0D0A; background: #fff; border-radius: 4px; width: 32px; height: 32px; padding: 0; box-shadow: 2px 2px 0 #0B0D0A; }
.dlg-body { padding: 16px 18px; overflow-y: auto; display: flex; flex-direction: column; gap: 18px; }
.dlg-foot { display: flex; gap: 12px; justify-content: flex-end; flex-wrap: wrap; padding: 14px 18px 18px; border-top: 3px solid var(--edge); }
.lbl { font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; margin-bottom: 7px; display: block; }
.row { display: flex; gap: 14px; flex-wrap: wrap; }
.row > * { flex: 1 1 160px; min-width: 0; }
.field input[type="date"], .field input[type="time"], .field input[type="text"], .field textarea { width: 100%; border: var(--bw) solid var(--edge); background: var(--surface); border-radius: var(--r); padding: 9px 11px; font-weight: 500; box-shadow: 3px 3px 0 var(--hard-c); }
.field textarea { min-height: 140px; resize: vertical; }
.field input:focus, .field textarea:focus { outline: none; background: var(--tint); }
.pick { display: flex; flex-wrap: wrap; gap: 9px; }
.pick label { display: inline-flex; align-items: center; gap: 7px; border: var(--bw) solid var(--edge); border-radius: var(--r); padding: 6px 12px 6px 8px; font-size: 13px; font-weight: 700; cursor: pointer; background: var(--surface); box-shadow: 3px 3px 0 var(--hard-c); transition: transform .08s, box-shadow .08s; }
.pick input { position: absolute; opacity: 0; pointer-events: none; }
.pick label:has(input:checked) { background: var(--green-soft); color: var(--on-pill); transform: translate(3px, 3px); box-shadow: 0 0 0 var(--hard-c); }
.pick label:has(input:focus-visible) { outline: 3px solid var(--green); outline-offset: 2px; }
.x-btn { border: 0; background: none; padding: 4px 6px; border-radius: 4px; font-weight: 800; }
.x-btn:hover { color: var(--danger); }
.err { background: var(--danger); color: #fff; font-size: 13px; font-weight: 700; padding: 8px 12px; border: 2px solid var(--edge); border-radius: var(--r); }

/* detail */
.seg { display: inline-flex; border: var(--bw) solid var(--edge); border-radius: var(--r); overflow: hidden; box-shadow: 3px 3px 0 var(--hard-c); }
.seg button { border: 0; background: var(--surface); padding: 7px 13px; font-weight: 800; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; display: inline-flex; gap: 6px; align-items: center; }
.seg button + button { border-left: var(--bw) solid var(--edge); }
.seg button svg { width: 14px; height: 14px; }
.seg button[aria-pressed="true"] { color: var(--on-pill); }
.seg button[aria-pressed="true"].s-pending { background: var(--pend-soft); }
.seg button[aria-pressed="true"].s-scheduled { background: var(--sched-soft); }
.seg button[aria-pressed="true"].s-uploaded { background: var(--green-soft); }
.confirm { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-right: auto; font-size: 14px; font-weight: 800; }
.confirm .danger-btn { margin: 0; background: var(--danger); color: #fff; }

/* toast */
.toast { position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); background: var(--sched-soft); color: var(--on-pill); border: var(--bw) solid #0B0D0A; box-shadow: 4px 4px 0 #0B0D0A; padding: 10px 16px; border-radius: var(--r); font-weight: 800; font-size: 14px; opacity: 0; pointer-events: none; transition: .2s; z-index: 900; max-width: calc(100vw - 32px); }
.toast.on { opacity: 1; transform: translate(-50%, 0); }

/* ---------- Loader: logo in the centre, green circle orbiting ---------- */
.loader { position: fixed; inset: 0; z-index: 800; display: grid; place-items: center; background: var(--scrim); }
.loader-box { display: flex; flex-direction: column; align-items: center; gap: 16px; background: var(--surface); border: 3px solid var(--edge); border-radius: 12px; box-shadow: var(--hard-lg); padding: 26px 34px 22px; }
.spin { position: relative; width: 132px; height: 132px; display: grid; place-items: center; }
.spin .mark { width: 62px; height: 62px; animation: breathe 1.6s ease-in-out infinite; }
.spin .ring { position: absolute; inset: 0; width: 100%; height: 100%; animation: orbit 1.1s linear infinite; }
.spin .ring circle { fill: none; stroke-width: 6; }
.spin .ring .track { stroke: var(--tint); }
.spin .ring .arc { stroke: var(--green); stroke-linecap: round; stroke-dasharray: 120 400; }
.loader-text { font-weight: 800; font-size: 13px; text-transform: uppercase; letter-spacing: .08em; font-variant-numeric: tabular-nums; }
@keyframes orbit { to { transform: rotate(360deg); } }
@keyframes breathe { 50% { transform: scale(.93); } }

/* ---------- Intro: kinetic logo sequence ---------- */
#intro { position: fixed; inset: 0; z-index: 1000; cursor: pointer; }
#intro .layer { position: absolute; inset: 0; clip-path: polygon(0% 0, 200% 0, 200% 100%, -40% 100%); animation: wipe .62s cubic-bezier(.7, 0, .25, 1) forwards; }
#intro .w-g { background: var(--green); animation-delay: 2.62s; }
#intro .w-k { background: var(--logo-k); animation-delay: 2.5s; }
#intro .stage { background: var(--surface); animation-delay: 2.38s; display: grid; place-items: center; overflow: hidden; }
@keyframes wipe { to { clip-path: polygon(140% 0, 200% 0, 200% 100%, 100% 100%); } }
.stage-in { display: flex; flex-direction: column; align-items: center; gap: 22px; }
.hero-mark { position: relative; width: 180px; height: 180px; }
.hero-mark svg { width: 100%; height: 100%; overflow: visible; }
.hero-mark .pc { transform-box: fill-box; transform-origin: center; opacity: 0; animation: fly .78s cubic-bezier(.2, .9, .25, 1.12) forwards; }
.hero-mark .pc1 { --fx: -900px; --fy: 2100px; animation-delay: .15s; }
.hero-mark .pc2 { --fx: 760px; --fy: -1800px; animation-delay: .32s; }
.hero-mark .pc3 { --fx: -760px; --fy: 1800px; animation-delay: .49s; }
@keyframes fly {
  0% { opacity: 0; transform: translate(var(--fx), var(--fy)) scaleY(1.6); }
  20% { opacity: 1; }
  70% { transform: translate(0, 0) scaleY(.92); }
  100% { opacity: 1; transform: translate(0, 0) scaleY(1); }
}
.hero-mark .halo { position: absolute; inset: -52px; width: calc(100% + 104px); height: calc(100% + 104px); animation: orbit 2.4s linear 1.1s infinite; }
.hero-mark .halo circle { fill: none; stroke: var(--green); stroke-width: 3; stroke-linecap: round; stroke-dasharray: 700; stroke-dashoffset: 700; animation: draw .9s cubic-bezier(.6, 0, .2, 1) 1.05s forwards; }
@keyframes draw { to { stroke-dashoffset: 180; } }
.hero-mark .flash { position: absolute; inset: -10%; border-radius: 50%; background: radial-gradient(circle, color-mix(in srgb, var(--green) 30%, transparent), transparent 65%); opacity: 0; animation: flash .7s ease-out .95s; }
@keyframes flash { 30% { opacity: 1; transform: scale(1.1); } 100% { opacity: 0; transform: scale(1.5); } }
.word { display: flex; overflow: hidden; font-family: "Lexend", "Arial Black", Arial, sans-serif; font-weight: 800; font-size: clamp(40px, 9.5vw, 76px); line-height: 1.12; letter-spacing: -.015em; color: var(--ink); padding: 0 .15em; }
.word span { display: inline-block; transform: translateY(115%) skewX(-24deg); animation: rise .55s cubic-bezier(.2, .9, .2, 1) forwards; animation-delay: calc(1.2s + var(--i) * 45ms); }
.word span.g { color: var(--green); }
@keyframes rise { to { transform: translateY(0) skewX(-13deg); } }
.by { font-family: "Lexend", Arial, sans-serif; font-weight: 400; font-size: clamp(16px, 2.6vw, 22px); color: var(--ink); margin-top: -16px; opacity: 0; animation: fade .5s ease 1.65s forwards; }
.tag { font-weight: 800; font-size: 12px; letter-spacing: .32em; text-transform: uppercase; color: var(--on-pill); background: var(--green-soft); border: 2.5px solid var(--edge); box-shadow: 3px 3px 0 var(--hard-c); padding: 5px 10px 5px calc(10px + .32em); border-radius: 4px; opacity: 0; animation: fade .5s ease 1.75s forwards; }
@keyframes fade { to { opacity: 1; } }
.stage-in { animation: lift .5s cubic-bezier(.6, 0, .4, 1) 2.15s forwards; }
@keyframes lift { to { transform: scale(.94); } }
.skip { position: absolute; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); font-size: 12px; color: var(--muted); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }

@media (prefers-reduced-motion: reduce) {
  #intro .layer { animation: none; }
  #intro { animation: fade-out .4s ease 1.2s forwards; }
  .hero-mark .pc, .tag, .by, .hero-mark .halo circle, .stage-in, .hero-mark .halo, .hero-mark .flash { animation: none; opacity: 1; transform: none; stroke-dashoffset: 180; }
  .hero-mark .flash { opacity: 0; }

}
@keyframes fade-out { to { opacity: 0; } }

</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* =====================================================================
   The calendar saves its posts in this Supabase project. The key below
   is the public "anon" key: it's meant to be in the page.
   ===================================================================== */
const SUPABASE_URL = "https://gstdjtjvlncjmyshhelx.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdzdGRqdGp2bG5jam15c2hoZWx4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI1NzQ3NzUsImV4cCI6MjEwODE1MDc3NX0.UZTfVQ5OyvWFVVmLmkad0EVrC4CTsKEwxuscYjAkUn8";

(() => {
  const sb = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
  const PLATFORMS = [
    { k: "instagram", label: "Instagram", short: "IG" },
    { k: "facebook", label: "Facebook", short: "FB" },
    { k: "linkedin", label: "LinkedIn", short: "in" },
    { k: "x", label: "X", short: "X" },
    { k: "tiktok", label: "TikTok", short: "TT" },
    { k: "youtube", label: "YouTube", short: "YT" },
  ];
  const STATUS = {
    pending: { label: "Pending", icon: "i-pending" },
    scheduled: { label: "Scheduled", icon: "i-clock" },
    uploaded: { label: "Uploaded", icon: "i-check" },
  };
  const DOW = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];

  const $ = (id) => document.getElementById(id);
  const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
  const pad = (n) => String(n).padStart(2, "0");
  const ymd = (d) => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  const parse = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
  const fmtTime = (t) => { if (!t) return ""; const [h, m] = t.split(":").map(Number); return ((h % 12) || 12) + ":" + pad(m) + (h < 12 ? " AM" : " PM"); };
  const longDate = (s) => parse(s).toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
  const shortDate = (s) => parse(s).toLocaleDateString("en-GB", { day: "numeric", month: "short" });
  const svgUse = (id, cls) => { const s = document.createElementNS("http://www.w3.org/2000/svg", "svg"); if (cls) s.setAttribute("class", cls); s.setAttribute("aria-hidden", "true"); const u = document.createElementNS("http://www.w3.org/2000/svg", "use"); u.setAttribute("href", "#" + id); s.appendChild(u); return s; };
  const newId = () => (window.crypto && crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));

  const state = {
    posts: new Map(),
    month: (() => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), 1); })(),
    selected: ymd(new Date()),
    canEdit: true, ready: false, introDone: false, detailId: null, channel: null,
  };

  /* ---------- Intro ---------- */
  const intro = $("intro");
  let introTimer;
  function endIntro() {
    if (state.introDone) return;
    state.introDone = true;
    clearTimeout(introTimer);
    intro.remove();
    if (!state.ready) showLoader("Loading calendar");
  }
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  introTimer = setTimeout(endIntro, reduce ? 1700 : 3350);
  intro.addEventListener("click", endIntro);

  /* ---------- Loader & toast ---------- */
  let loaderCount = 0;
  function showLoader(text) { loaderCount++; $("loader-text").textContent = text || "Loading"; $("loader").hidden = false; }
  function hideLoader() { loaderCount = Math.max(0, loaderCount - 1); if (!loaderCount) $("loader").hidden = true; }
  let toastT;
  function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 3600); }
  function markReady() { if (state.ready) return; state.ready = true; if (state.introDone) hideLoader(); }
  function notice(msg) { const n = $("notice"); n.textContent = msg || ""; n.hidden = !msg; }

  /* ---------- Data ---------- */
  function setPosts(list) {
    const m = new Map();
    list.forEach((r) => { if (r && r.id && r.date) m.set(r.id, { ...r, platforms: Array.isArray(r.platforms) ? r.platforms : [] }); });
    state.posts = m;
    renderAll();
  }
  async function load(silent) {
    if (!sb) { notice("The calendar couldn't connect. Check your internet connection and reload."); return; }
    const { data, error } = await sb.from("posts").select("id,date,time,title,platforms,status,created_at,updated_at").order("date");
    if (error) { if (!silent) notice(/status_check|permission|policy|row-level/i.test(error.message) ? "The calendar's database needs its one-time update. See the README." : "The calendar couldn't load: " + error.message); return; }
    notice("");
    setPosts(data || []);
  }
  let reloadT;
  function scheduleReload() { clearTimeout(reloadT); reloadT = setTimeout(() => load(true), 300); }
  function errText(error) {
    const msg = (error && error.message) || "";
    if (/status_check|check constraint/i.test(msg)) return "The Pending status needs the database update in the README.";
    if (/row-level|policy|permission/i.test(msg)) return "The calendar's database isn't open for editing yet. Run the SQL in the README.";
    return "Saving failed: " + (msg || "check your connection and try again.");
  }

  /* ---------- Small builders ---------- */
  function pfBadge(k) { const p = PLATFORMS.find((x) => x.k === k); const b = el("span", "pf pf-" + k, p ? p.short : k); b.title = p ? p.label : k; return b; }
  function stKey(s) { return STATUS[s] ? s : "scheduled"; }
  function statusPill(s) { const k = stKey(s); const p = el("span", "status st-" + k); p.append(svgUse(STATUS[k].icon), document.createTextNode(STATUS[k].label)); return p; }
  function postLabel(p) { return p.title || "Untitled post"; }
  function sortPosts(arr) { return arr.sort((a, b) => (a.time || "99").localeCompare(b.time || "99") || (a.created_at || "").localeCompare(b.created_at || "")); }
  function postsOn(date) { return sortPosts([...state.posts.values()].filter((p) => p.date === date)); }

  /* ---------- Legend ---------- */
  function renderLegend() {
    const lg = $("legend"); lg.textContent = "";
    const a = el("div", "legend-group");
    PLATFORMS.forEach((p) => { const i = el("span", "legend-item"); i.append(pfBadge(p.k), document.createTextNode(p.label)); a.append(i); });
    const b = el("div", "legend-group");
    Object.keys(STATUS).forEach((k) => b.append(statusPill(k)));
    lg.append(a, b);
  }

  /* ---------- Calendar ---------- */
  function renderDow() {
    const d = $("dow"); d.textContent = "";
    DOW.forEach((n) => { const c = el("div"); c.append(el("span", "long", n.slice(0, 3)), el("span", "short", n[0])); d.append(c); });
  }
  function renderGrid() {
    const m = state.month;
    $("month-label").textContent = m.toLocaleDateString("en-GB", { month: "long", year: "numeric" });
    const grid = $("grid"); grid.textContent = "";
    const offset = (m.getDay() + 6) % 7;
    const days = new Date(m.getFullYear(), m.getMonth() + 1, 0).getDate();
    const cells = Math.ceil((offset + days) / 7) * 7;
    const today = ymd(new Date());
    for (let i = 0; i < cells; i++) {
      const d = new Date(m.getFullYear(), m.getMonth(), 1 - offset + i);
      const key = ymd(d);
      const cell = el("div", "cell");
      if (d.getMonth() !== m.getMonth()) cell.classList.add("out");
      if (key === today) cell.classList.add("today");
      if (key === state.selected) cell.classList.add("sel");
      const num = el("button", "num", String(d.getDate()));
      num.type = "button";
      num.setAttribute("aria-label", longDate(key));
      cell.append(num);
      const list = postsOn(key);
      const dots = el("div", "dots");
      list.forEach((p, idx) => {
        const k = stKey(p.status);
        dots.append(el("i", "st-" + k));
        if (idx < 3) {
          const c = el("button", "chip st-" + k);
          c.type = "button";
          const pfs = el("span", "pfs"); (p.platforms || []).forEach((pk) => pfs.append(pfBadge(pk)));
          c.append(pfs, el("span", "t", (p.time ? fmtTime(p.time) + " · " : "") + postLabel(p)), svgUse(STATUS[k].icon));
          c.title = postLabel(p) + " · " + STATUS[k].label;
          c.addEventListener("click", (e) => { e.stopPropagation(); selectDay(key); openDetail(p.id); });
          cell.append(c);
        }
      });
      if (list.length > 3) cell.append(el("div", "more", "+" + (list.length - 3) + " more"));
      if (list.length) cell.append(dots);
      cell.addEventListener("click", () => selectDay(key));
      grid.append(cell);
    }
  }
  function selectDay(key) {
    state.selected = key;
    const d = parse(key);
    if (d.getMonth() !== state.month.getMonth() || d.getFullYear() !== state.month.getFullYear()) state.month = new Date(d.getFullYear(), d.getMonth(), 1);
    renderGrid(); renderDay();
  }

  /* ---------- Day panel ---------- */
  function renderDay() {
    const box = $("day"); box.textContent = "";
    const d = parse(state.selected);
    const head = el("div");
    head.append(el("div", "eyebrow", d.toLocaleDateString("en-GB", { weekday: "long" })), el("h2", null, d.toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" })));
    box.append(head);
    const list = postsOn(state.selected);
    if (!list.length) {
      box.append(el("div", "empty", state.canEdit ? "Nothing planned for this day yet. Add what's going out." : "Nothing planned for this day."));
    } else {
      const wrap = el("div", "day-list");
      list.forEach((p) => {
        const b = el("button", "post"); b.type = "button";
        const body = el("div", "post-body");
        const top = el("div", "post-top");
        (p.platforms || []).forEach((k) => top.append(pfBadge(k)));
        if (p.time) top.append(el("span", "time", fmtTime(p.time)));
        top.append(statusPill(p.status));
        body.append(top, el("div", "post-title", postLabel(p)));
        b.append(body);
        b.addEventListener("click", () => openDetail(p.id));
        wrap.append(b);
      });
      box.append(wrap);
    }
    if (state.canEdit) {
      const add = el("button", "primary"); add.type = "button";
      add.textContent = "Add content for this day";
      add.addEventListener("click", () => openEditor(null, state.selected));
      box.append(add);
    }
  }
  function renderAll() { renderGrid(); renderDay(); if (state.detailId) renderDetail(); }

  /* ---------- Detail ---------- */
  const detail = $("detail");
  function openDetail(id) { state.detailId = id; renderDetail(); if (!detail.open) detail.showModal(); }
  detail.addEventListener("close", () => { state.detailId = null; });
  detail.addEventListener("click", (e) => { if (e.target === detail) detail.close(); });

  function renderDetail() {
    const p = state.posts.get(state.detailId);
    const box = $("detail-in"); box.textContent = "";
    if (!p) { if (detail.open) detail.close(); return; }
    const head = el("div", "dlg-head");
    const h = el("h3", null, postLabel(p));
    h.append(el("div", "sub", longDate(p.date) + (p.time ? " · " + fmtTime(p.time) : "")));
    const close = el("button", "x-btn", "✕"); close.type = "button"; close.setAttribute("aria-label", "Close");
    close.addEventListener("click", () => detail.close());
    head.append(h, close);

    const body = el("div", "dlg-body");
    const meta = el("div", "row");
    const pfBox = el("div"); pfBox.append(el("span", "lbl", "Platforms"));
    const pfl = el("div", "legend-group");
    if ((p.platforms || []).length) p.platforms.forEach((k) => { const i = el("span", "legend-item"); i.append(pfBadge(k), document.createTextNode((PLATFORMS.find((x) => x.k === k) || {}).label || k)); pfl.append(i); });
    else pfl.append(el("span", "time", "No platform set"));
    pfBox.append(pfl);
    const stBox = el("div"); stBox.append(el("span", "lbl", "Status"));
    if (state.canEdit) {
      const seg = el("div", "seg");
      Object.entries(STATUS).forEach(([k, v]) => {
        const b = el("button", "s-" + k); b.type = "button";
        b.setAttribute("aria-pressed", String(stKey(p.status) === k));
        b.append(svgUse(v.icon), document.createTextNode(v.label));
        b.addEventListener("click", () => setStatus(p, k));
        seg.append(b);
      });
      stBox.append(seg);
    } else stBox.append(statusPill(p.status));
    meta.append(pfBox, stBox);
    body.append(meta);
    box.append(head, body);

    if (state.canEdit) {
      const foot = el("div", "dlg-foot");
      const del = el("button", "danger-btn", "Delete post"); del.type = "button";
      del.addEventListener("click", () => {
        const c = el("div", "confirm");
        c.append(document.createTextNode("Delete this post?"));
        const yes = el("button", "danger-btn", "Delete"); yes.type = "button";
        const no = el("button", "ghost", "Keep"); no.type = "button";
        yes.addEventListener("click", () => deletePost(p));
        no.addEventListener("click", () => c.replaceWith(del));
        c.append(yes, no);
        del.replaceWith(c);
      });
      const edit = el("button", "primary", "Edit post"); edit.type = "button";
      edit.addEventListener("click", () => { detail.close(); openEditor(p); });
      foot.append(del, edit);
      box.append(foot);
    }
  }

  async function setStatus(p, k) {
    if (stKey(p.status) === k) return;
    showLoader("Saving");
    const { error } = await sb.from("posts").update({ status: k, updated_at: new Date().toISOString() }).eq("id", p.id);
    hideLoader();
    if (error) { toast(errText(error)); return; }
    const cur = state.posts.get(p.id); if (cur) cur.status = k;
    renderAll();
    toast("Marked as " + STATUS[k].label.toLowerCase());
  }

  /* ---------- Editor ---------- */
  const editor = $("editor");
  const ed = { post: null };
  function buildPlatformPick() {
    const box = $("f-platforms"); box.textContent = "";
    PLATFORMS.forEach((p) => {
      const l = el("label");
      const i = el("input"); i.type = "checkbox"; i.id = "f-pf-" + p.k; i.value = p.k;
      l.append(i, pfBadge(p.k), document.createTextNode(p.label));
      box.append(l);
    });
  }
  function openEditor(post, date) {
    ed.post = post || null;
    $("form-title").textContent = post ? "Edit post" : "Add content";
    $("f-date").value = post ? post.date : (date || state.selected);
    $("f-time").value = post ? (post.time || "") : "";
    $("f-title").value = post ? (post.title || "") : "";
    PLATFORMS.forEach((p) => { $("f-pf-" + p.k).checked = !!(post && (post.platforms || []).includes(p.k)); });
    $("f-st-" + (post ? stKey(post.status) : "scheduled")).checked = true;
    $("f-err").hidden = true;
    editor.showModal();
  }
  $("form-close").addEventListener("click", () => editor.close());
  $("form-cancel").addEventListener("click", () => editor.close());

  $("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const err = $("f-err");
    const date = $("f-date").value;
    const platforms = PLATFORMS.filter((p) => $("f-pf-" + p.k).checked).map((p) => p.k);
    const title = $("f-title").value.trim();
    if (!date) { err.hidden = false; err.textContent = "Pick the date this post goes out."; return; }
    if (!title) { err.hidden = false; err.textContent = "Write what's being posted before saving."; return; }
    if (!platforms.length) { err.hidden = false; err.textContent = "Choose at least one platform."; return; }
    err.hidden = true;

    const prev = ed.post;
    const now = new Date().toISOString();
    const row = {
      id: prev ? prev.id : newId(),
      date, time: $("f-time").value || "", title, platforms,
      status: (document.querySelector('input[name="f-status"]:checked') || {}).value || "scheduled",
      created_at: prev ? (prev.created_at || now) : now,
      updated_at: now,
    };
    editor.close();
    showLoader("Saving to calendar");
    const { error } = await sb.from("posts").upsert(row);
    if (error) {
      hideLoader();
      err.hidden = false; err.textContent = errText(error);
      editor.showModal();
      return;
    }
    state.posts.set(row.id, row);
    hideLoader();
    toast(prev ? "Post updated" : "Added to " + shortDate(date));
    selectDay(date);
  });

  async function deletePost(p) {
    detail.close();
    showLoader("Deleting post");
    const { error } = await sb.from("posts").delete().eq("id", p.id);
    hideLoader();
    if (error) { toast(errText(error)); return; }
    state.posts.delete(p.id); renderAll();
    toast("Post deleted");
  }

  /* ---------- Navigation ---------- */
  $("prev").addEventListener("click", () => { state.month = new Date(state.month.getFullYear(), state.month.getMonth() - 1, 1); renderGrid(); });
  $("next").addEventListener("click", () => { state.month = new Date(state.month.getFullYear(), state.month.getMonth() + 1, 1); renderGrid(); });
  $("today").addEventListener("click", () => selectDay(ymd(new Date())));
  $("add-top").addEventListener("click", () => openEditor(null, state.selected));

  /* ---------- Boot ---------- */
  renderLegend(); renderDow(); buildPlatformPick(); renderAll();

  // Live updates: everyone's screen changes as soon as someone saves.
  if (sb) {
    state.channel = sb.channel("posts-live")
      .on("postgres_changes", { event: "*", schema: "public", table: "posts" }, scheduleReload)
      .subscribe();
  }
  setInterval(() => { if (!document.hidden) load(true); }, 120000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden && state.ready) load(true); });

  load().finally(markReady);
})();
</script>
</body>
</html>
