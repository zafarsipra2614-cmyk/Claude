e sukuk holders.", "say": "For using it, the government pays rent to the sukuk holders.", "chunks": ["For using it, the government", "pays rent to the sukuk holders."]}, {"sub": "That's the big idea. Your return is rent from an asset, not interest on a loan.", "say": "That's the big idea. Your return is rent from an asset, not interest on a loan.", "chunks": ["That's the big idea.", "Your return is rent from an asset,", "not interest on a loan."]}, {"sub": "That's why it's called an Ijarah sukuk. Ijarah means lease.", "say": "That's why it's called an Ijarah sukuk. Ijarah means lease.", "chunks": ["That's why it's called an Ijarah sukuk.", "Ijarah means lease."]}, {"sub": "When the term ends, after one, three, five or ten years, the government buys the asset back,", "say": "When the term ends, after one, three, five, or ten years, the government buys the asset back,", "chunks": ["When the term ends,", "after one, three, five or ten years,", "the government buys the asset back,"]}, {"sub": "and investors get their money back.", "say": "and investors get their money back.", "chunks": ["and investors get their money back."]}, {"sub": "So where does the stock exchange come in?", "say": "So where does the stock exchange come in?", "chunks": ["So where does", "the stock exchange come in?"]}, {"sub": "Since December 2023, Government of Pakistan Ijarah Sukuk have been auctioned through PSX.", "say": "Since December twenty twenty-three, Government of Pakistan Ijarah Sukuk have been auctioned through P S X.", "chunks": ["Since December 2023,", "Government of Pakistan Ijarah Sukuk", "have been auctioned through PSX."]}, {"sub": "They come in units of 5,000 rupees, small enough for a retail investor.", "say": "They come in units of five thousand rupees, small enough for a retail investor.", "chunks": ["They come in units of 5,000 rupees,", "small enough for a retail investor."]}, {"sub": "Open a brokerage account and a CDC sub-account, and you can buy and sell them like shares.   /* 17 */ [1.2, 1.0, (i) => { q.erase('trillion', 'q2'); q.draw('paid', 0.5); q.until(W(i, 'price') - 0.3); q.draw('price', 0.9); }],
  /* 18 */ [1.6, 0.4, (i) => { q.cam({ cx: 540, cy: 770, w: 1250 }, 1.4); q.until(LINES[i].v1 + 0.4); q.erase('m1', 'investors', 'government', 'rentLbl', 'sukukRow2', 'psx2'); q.draw('take', 0.9); q.draw('take2', 1.2); q.wait(2.6); }],
];
function schedule() {
  clock = 0;
  for (let i = 0; i < SCENES.length; i++) {
    const [pre, post0, fn] = SCENES[i], slot = clock, post = i === SCENES.length - 1 ? post0 : Math.max(0.4, post0 - 0.3);
    LINES[i] = { i, slot, v0: slot + pre, dur: DURS[i], v1: slot + pre + DURS[i] };
    fn(i);
    clock = Math.max(LINES[i].v1 + post, clock);
    LINES[i].end = clock;
  }
  E.hand.t0 = E.clock.t1; E.hand.t1 = E.clock.t1 + 0.15; // the hand appears with the clock face
  window.TOTAL = clock;
}

// ---------- rendering a moment ----------
const ease = u => u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
const clamp = u => Math.max(0, Math.min(1, u));
function camAt(t) {
  let c = CAM0;
  for (const k of CAMS) {
    if (t >= k.t1) { c = k.to; continue; }
    if (t > k.t0) { const u = ease((t - k.t0) / (k.t1 - k.t0)); const s0 = 1080 / c.w, s1 = 1080 / k.to.w, s = s0 * Math.pow(s1 / s0, u);
      // keep the screen motion straight: interpolate the focus in screen-weighted space
      const w0 = 1 / s0, w1 = 1 / s1, f = (1 / s - w0) / ((w1 - w0) || 1);
      const g = Math.abs(w1 - w0) < 1e-6 ? u : f;
      return { cx: c.cx + (k.to.cx - c.cx) * g, cy: c.cy + (k.to.cy - c.cy) * g, s }; }
    break;
  }
  return { cx: c.cx, cy: c.cy, s: 1080 / c.w };
}
const toScreen = (c, x, y) => [(x - c.cx) * c.s + 540, (y - c.cy) * c.s + 860];
let penIcon;
function seek(t) {
  const c = camAt(t);
  world.setAttribute('transform', `translate(540 860) scale(${c.s}) translate(${-c.cx} ${-c.cy})`);
  let pen = null;
  for (const id in E) {
    const e = E[id];
    const p = clamp((t - e.t0) / (e.t1 - e.t0)), qd = clamp((t - e.e0) / (e.e1 - e.e0));
    const drawing = t > e.t0 && t < e.t1, erasing = t > e.e0 && t < e.e1;
    if (e.kind === 'path') {
      const L = e.len, a = L * qd, b = L * p;
      if (b - a < 0.5) { e.node.setAttribute('visibility', 'hidden'); }
      else { e.node.setAttribute('visibility', 'visible'); e.node.setAttribute('stroke-dasharray', `${(b - a).toFixed(2)} ${(2 * L + 10).toFixed(1)}`); e.node.setAttribute('stroke-dashoffset', (-a).toFixed(2)); }
      if (drawing || erasing) { const pt = e.node.getPointAtLength(drawing ? b : a); const m = e.node.getCTM(); pen = { x: m.a * pt.x + m.c * pt.y + m.e, y: m.b * pt.x + m.d * pt.y + m.f, color: e.color }; }
    } else {
      const bb = e.bb, x0 = bb.x - 8, W = bb.width + 16;
      const xa = x0 + W * qd, xb = x0 + W * p;
      e.clip.setAttribute('x', xa); e.clip.setAttribute('y', bb.y - 10); e.clip.setAttribute('height', bb.height + 20); e.clip.setAttribute('width', Math.max(0, xb - xa));
      if (drawing || erasing) { const [sx, sy] = toScreen(c, drawing ? xb : xa, bb.y + bb.height * (0.55 + 0.25 * Math.sin(t * 38))); pen = { x: sx, y: sy, color: e.color }; }
    }
  }
  for (const m of MOVERS) {
    if (m.rot) { const u = clamp((t - m.t0) / (m.t1 - m.t0)); m.g.setAttribute('transform', `translate(${m.at[0]} ${m.at[1]}) rotate(${(360 * ease(u)).toFixed(2)})`); continue; }
    if (m.persist) { const u = ease(clamp((t - m.t0) / (m.t1 - m.t0))); const [x, y] = polyAt(m.pts, u); m.g.setAttribute('transform', `translate(${x} ${y})`); continue; }
    if (t <= m.t0 || t >= m.t1) { m.g.setAttribute('visibility', 'hidden'); continue; }
    const u = ease((t - m.t0) / (m.t1 - m.t0)), [x, y] = polyAt(m.pts, u);
    m.g.setAttribute('visibility', 'visible'); m.g.setAttribute('transform', `translate(${x.toFixed(1)} ${y.toFixed(1)})`);
  }
  if (pen) { penIcon.setAttribute('visibility', 'visible'); penIcon.setAttribute('transform', `translate(${pen.x.toFixed(1)} ${pen.y.toFixed(1)}) rotate(28)`); penIcon.querySelector('.cap').setAttribute('fill', pen.color); }
  else penIcon.setAttribute('visibility', 'hidden');
}
function makePen() {
  penIcon = el('g', { visibility: 'hidden' }, penG);
  el('path', { d: 'M0,0 L-6,-15 L6,-15 Z', fill: INK }, penIcon);
  el('rect', { class: 'cap', x: -10, y: -34, width: 20, height: 19, rx: 3, fill: INK }, penIcon);
  el('rect', { x: -13, y: -170, width: 26, height: 137, rx: 6, fill: '#e9e6dd', stroke: '#8d8a82', 'stroke-width': 2 }, penIcon);
  el('rect', { x: -6, y: -160, width: 5, height: 118, rx: 2, fill: '#fff', opacity: 0.8 }, penIcon);
}

// ---------- checks used before rendering ----------
function visibleWords(t) {
  const c = camAt(t); let n = 0; const names = [];
  for (const id in E) { const e = E[id]; if (e.kind !== 'text') continue;
    const p = clamp((t - e.t0) / (e.t1 - e.t0)), qd = clamp((t - e.e0) / (e.e1 - e.e0));
    if (p - qd <= 0.02) continue;
    const [x, y] = toScreen(c, e.bb.x + e.bb.width / 2, e.bb.y + e.bb.height / 2);
    if (x < 0 || x > 1080 || y < 0 || y > 1920) continue;
    n += e.words; names.push(e.str); }
  return { n, names };
}
window.seek = seek;
window.ready = document.fonts.ready.then(() => {
  build(); makePen();
  for (const id in E) { const e = E[id]; if (e.kind === 'path') e.len = e.node.getTotalLength(); else e.bb = e.node.getBBox(); }
  schedule(); seek(0);
  window.LINES = LINES; window.ACTS = ACTS; window.visibleWords = visibleWords;
  window.TEXTS = Object.values(E).filter(e => e.kind === 'text').map(e => ({ id: e.id, str: e.str, words: e.words, t1: e.t1, e0: e.e0 }));
  return true;
});
